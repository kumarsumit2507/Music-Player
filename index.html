<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
</head>

<body>
    <main class="container">
        <article class="music-card">
            <nav>
                <div class="search-box">
                    <input 
                        type="text" 
                        id="search-input" 
                        class="search-box__input"   
                        placeholder="Search track or artist..." 
                        autocomplete="off" 
                        aria-label="Search tracks or artists"
                        aria-autocomplete="list"
                        aria-controls="search-results"
                        aria-expanded="false"
                    />
                    <button type="button" class="search-box__btn" aria-label="Search">
                        <span class="material-symbols-outlined" aria-hidden="true">search</span>
                    </button>
                    <!-- Dynamic Search Results Dropdown -->
                    <div 
                        id="search-results" 
                        class="search-results search-results--hidden" 
                        role="listbox"
                        aria-label="Search results"
                    ></div>
                </div>
            </nav>

            <section class="card-main">
                <div class="music-img" role="img" aria-label="Album cover art"></div>

                <div class="music-info">
                    <h1 class="prim-h music-card__title">No Track Selected</h1>
                    <h3 class="sec-h music-card__artist">Select a song to play</h3>
                </div>

                <div class="music-controls">
                    <input 
                        type="range" 
                        value="0" 
                        min="0" 
                        id="music-timeline" 
                        aria-label="Track progress"
                    />
                </div>

                <div class="buttons">
                    <button type="button" class="btn" id="backward" aria-label="Rewind 10 seconds">
                        <span class="material-symbols-outlined" aria-hidden="true">fast_rewind</span>
                    </button>
                    <button type="button" class="btn" id="play-pause" aria-label="Play or pause track">
                        <span class="material-symbols-outlined" aria-hidden="true">play_arrow</span>
                    </button>
                    <button type="button" class="btn" id="forward" aria-label="Fast forward 10 seconds">
                        <span class="material-symbols-outlined" aria-hidden="true">fast_forward</span>
                    </button>
                </div>
            </section>
        </article>
    </main>


    <script src="https://sdk.scdn.co/spotify-player.js"></script>
